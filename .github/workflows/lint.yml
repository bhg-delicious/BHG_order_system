name: Lint & Format Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ESLint & Prettier
        run: npm install --no-save eslint prettier @eslint/js

      - name: Run ESLint
        run: npx eslint "js/**/*.js" "service-worker.js" --no-error-on-unmatched-pattern
        continue-on-error: true

      - name: Check Prettier formatting
        run: npx prettier --check "js/**/*.js" "*.html" "pages/*.html" "styles.css"
        continue-on-error: true

      - name: Check key files exist
        run: |
          for f in index.html manifest.webmanifest service-worker.js styles.css assets/icon-192.png assets/icon-512.png; do
            if [ ! -f "$f" ]; then
              echo "❌ 缺少關鍵檔案: $f"
              exit 1
            fi
          done
          echo "✅ 所有關鍵檔案存在"

      - name: Check SW reads version from URL
        run: |
          # 確認 service-worker.js 有從 URL 讀 ?v= 的邏輯
          if ! grep -q "searchParams.get('v')" service-worker.js; then
            echo "❌ service-worker.js 沒有從 URL 讀取版本號（缺少 searchParams.get('v')）"
            exit 1
          fi
          if ! grep -q 'bhg-cache-${SW_VERSION}' service-worker.js; then
            echo "❌ service-worker.js 的 CACHE_NAME 沒有使用 SW_VERSION"
            exit 1
          fi
          if grep -q "const CACHE_NAME = 'bhg-cache-v" service-worker.js; then
            echo "❌ service-worker.js 仍有硬編碼的 CACHE_NAME（應改為從 URL 讀取）"
            exit 1
          fi
          echo "✅ service-worker.js 正確從 URL 讀取版本號"

      - name: Check index.html registers SW with version
        run: |
          # 確認 index.html 有從 Supabase 讀版本號並帶入 SW URL
          if ! grep -q "from('system_settings')" index.html; then
            echo "❌ index.html 沒有從 Supabase 讀取 version"
            exit 1
          fi
          if ! grep -q "service-worker.js?v=" index.html; then
            echo "❌ index.html 註冊 SW 時沒有帶 ?v= 參數"
            exit 1
          fi
          if ! grep -q "updateViaCache: 'none'" index.html; then
            echo "❌ index.html 註冊 SW 時缺少 updateViaCache: 'none'"
            exit 1
          fi
          echo "✅ index.html 正確從 Supabase 讀版本並帶入 SW URL"

      - name: Check for undefined function references
        run: |
          echo "檢查常見的函數名稱錯誤..."
          if grep -rE "\bAdminLogin\b" js/ 2>/dev/null; then
            echo "❌ 發現 AdminLogin（應為 checkSupabaseAdminLogin）"
            exit 1
          fi
          echo "✅ 無明顯函數名稱錯誤"

<div id="page-admin-users" class="page-container">
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">
        <i class="fas fa-users-cog"></i> 用戶管理
      </h2>
    </div>

    <!-- ==================== Tabs 導覽 ==================== -->
    <div class="tabs-nav">
      <button class="tab-btn active" data-tab="tab-change-id">
        <i class="fas fa-id-card"></i> 更改學號
      </button>
      <button class="tab-btn" data-tab="tab-debt-whitelist">
        <i class="fas fa-hand-holding-dollar"></i> 欠錢白名單
      </button>
    </div>

    <!-- ==================== Tab 1：更改學號 ==================== -->
    <div id="tab-change-id" class="tab-content active">
      <p style="color: var(--gray); margin-bottom: 16px;">
        更改使用者的學號，會同步更新交易紀錄與訂單歷史。
      </p>

      <div class="form-group">
        <label class="form-label" for="changeOldUserId">原學號</label>
        <input
          type="text"
          id="changeOldUserId"
          class="form-control"
          placeholder="請輸入 6 位數字"
          maxlength="6"
          inputmode="numeric"
          pattern="\d{6}"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="changeNewUserId">新學號</label>
        <input
          type="text"
          id="changeNewUserId"
          class="form-control"
          placeholder="請輸入 6 位數字"
          maxlength="6"
          inputmode="numeric"
          pattern="\d{6}"
        >
      </div>

      <button class="btn btn-warning" onclick="confirmChangeUserId()">
        <i class="fas fa-exchange-alt"></i> 確認更改
      </button>

      <div id="changeUserIdResult" style="margin-top: 15px;"></div>
    </div>

    <!-- ==================== Tab 2：欠錢白名單 ==================== -->
    <div id="tab-debt-whitelist" class="tab-content">
      <p style="color: var(--gray); margin-bottom: 16px;">
        名單內的學生餘額不足時仍可點餐，餘額會變成負數（賒帳）。
      </p>

      <!-- 新增表單 -->
      <form id="debtWhitelistAddForm" onsubmit="addDebtWhitelist(event)">
        <div style="display: grid; grid-template-columns: 1fr 1.5fr auto; gap: 8px;">
          <input
            id="dwUserId"
            class="form-control"
            placeholder="學號（6 位）"
            maxlength="6"
            inputmode="numeric"
            pattern="\d{6}"
            required
          >
          <input
            id="dwNote"
            class="form-control"
            placeholder="備註（選填）"
            maxlength="100"
          >
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-plus"></i> 新增
          </button>
        </div>
      </form>

      <div id="dwResult" style="margin-top: 15px;"></div>

      <div style="margin-top: 20px;">
        <button class="btn btn-secondary" onclick="loadDebtWhitelist(event)">
          <i class="fas fa-sync"></i> 重新載入
        </button>
      </div>

      <div id="dwDisplay" style="margin-top: 15px;"></div>
    </div>

  </div>
</div>

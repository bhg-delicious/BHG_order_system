<div id="page-admin-whitelist" class="page-container">
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">
        <i class="fas fa-hand-holding-dollar"></i> 欠錢白名單
      </h2>
    </div>

    <p style="color: var(--gray); margin-bottom: 16px;">
      名單內的學生餘額不足時仍可點餐，餘額會變成負數。
    </p>

    <!-- 新增 -->
    <form id="debtWhitelistAddForm" onsubmit="addDebtWhitelist(event)">
      <div style="display: grid; grid-template-columns: 1fr 1.5fr auto; gap: 8px;">
        <input id="dwUserId" class="form-control" placeholder="學號（6 位）"
               maxlength="6" inputmode="numeric" pattern="\d{6}" required>
        <input id="dwNote" class="form-control" placeholder="備註（選填）" maxlength="100">
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-plus"></i> 新增
        </button>
      </div>
    </form>

    <div id="dwResult" style="margin-top: 15px;"></div>

    <!-- 列表 -->
    <div style="margin-top: 20px;">
      <button class="btn btn-secondary" onclick="loadDebtWhitelist(event)">
        <i class="fas fa-sync"></i> 重新載入
      </button>
    </div>
    <div id="dwDisplay" style="margin-top: 15px;"></div>
  </div>
</div>

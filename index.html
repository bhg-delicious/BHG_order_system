    <header class="header">

            <h1>正式系統</h1>
            <div class="header-subtitle">儲值系統</div>
        </div>

        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
            <button class="admin-btn" onclick="showAdminModal()" style="margin: 0; padding: 4px 8px; font-size: 0.8rem;">
                <span id="adminStatusIcon" style="font-size: 0.9rem; line-height: 1;">🛡️</span>
                <span id="adminStatusText">管理員</span>
            </button>

            <button class="admin-btn" onclick="toggleNotifications(event)" style="margin: 0; padding: 4px 8px; font-size: 0.8rem;">
                <span id="notify" style="font-size: 0.9rem; line-height: 1;">🔕</span>
                <span id="notifyText">通知</span>
            </button>
        </div>
    </header>

    <main id="pageContent">

        <!-- ==================== 登入 / 註冊頁面（首頁寫死） ==================== -->
        <div id="page-user-register" class="page-container active">

            <!-- ========== 登入區塊 ========== -->
            <div id="loginSection" class="card">
                <div class="card-header">
                    <h2 class="card-title">
                        <i class="fas fa-sign-in-alt"></i> 登入
                    </h2>
                </div>

                <p style="color: var(--gray); margin-bottom: 16px;">
                    請輸入學號和密碼登入系統
                </p>

                <form id="loginForm" autocomplete="on">
                    <div class="form-group">
                        <label class="form-label" for="loginStudentId">學號</label>
                        <input 
                            type="text" 
                            id="loginStudentId" 
                            name="username"
                            class="form-control" 
                            placeholder="請輸入6位數學號" 
                            maxlength="6" 
                            inputmode="numeric" 
                            pattern="\d{6}"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="loginPassword">密碼</label>
                        <input 
                            type="password" 
                            id="loginPassword" 
                            name="password"
                            class="form-control" 
                            placeholder="請輸入密碼" 
                            inputmode="text"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> 登入
                    </button>
                </form>

                <div id="loginResult" style="margin-top: 15px;"></div>

                <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid #eee;">
                    <p style="color: var(--gray); margin-bottom: 12px;">還沒有帳號？</p>
                    <button class="btn btn-secondary" onclick="switchToRegister()">
                        <i class="fas fa-user-plus"></i> 申請帳號
                    </button>

                    <button class="btn btn-info" onclick="showAdminModal()" style="margin-top: 10px;">
                        <i class="fas fa-user-shield"></i> 管理員登入
                    </button>
                </div>
            </div>

            <!-- ========== 註冊區塊 ========== -->
            <div id="registerSection" class="card" style="display: none;">
                <div class="card-header">
                    <h2 class="card-title">
                        <i class="fas fa-user-plus"></i> 申請帳號
                    </h2>
                </div>

                <form id="registerForm" autocomplete="on">
                    <div class="form-group">
                        <label class="form-label" for="registerStudentId">學號</label>
                        <input 
                            type="text" 
                            id="registerStudentId" 
                            name="username"
                            class="form-control" 
                            placeholder="請輸入6位數學號" 
                            maxlength="6" 
                            inputmode="numeric" 
                            pattern="\d{6}"
                            autocomplete="username"
                            required
                        >
                        <div class="form-text">範例：123456</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="registerName">姓名</label>
                        <input 
                            type="text" 
                            id="registerName" 
                            name="name"
                            class="form-control" 
                            placeholder="請輸入真實姓名" 
                            maxlength="20"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="registerPassword">密碼</label>
                        <input 
                            type="password" 
                            id="registerPassword" 
                            name="password"
                            class="form-control" 
                            placeholder="請設定密碼（至少 6 位）" 
                            minlength="6"
                            inputmode="text"
                            autocomplete="new-password"
                            required
                        >
                        <div class="form-text">密碼至少 6 位，註冊後可用學號和密碼登入</div>
                    </div>

                    <div class="message info" style="margin-bottom: 15px;">
                        <i class="fas fa-info-circle"></i> 申請成功後餘額為 0 元。
                    </div>

                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-check-circle"></i> 送出申請
                    </button>
                </form>

                <div id="registerResult" style="margin-top: 15px;"></div>

                <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid #eee;">
                    <p style="color: var(--gray); margin-bottom: 12px;">已經有帳號？</p>
                    <button class="btn btn-secondary" onclick="switchToLogin()">
                        <i class="fas fa-sign-in-alt"></i> 返回登入
                    </button>
                </div>
            </div>

        </div>

    </main>

    <!-- ══════════════════════════════════════════════════════════
         Service Worker：從 Supabase 讀版本號 → 帶入 SW URL → 自動更新
         ══════════════════════════════════════════════════════════ -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async function() {
          // 1. 從 Supabase 讀取系統版本號
          let version = 'unknown';
          try {
            const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
            const sb = createClient(
              'https://wvvmnombzkkrtxxxucqe.supabase.co',
              'sb_publishable_oK9kGQMbcBdGyoerrrfDzQ_yWyRZcQf'
            );
            const { data, error } = await sb
              .from('system_settings')
              .select('value')
              .eq('key', 'version')
              .maybeSingle();

            if (error) {
              console.warn('⚠️ 讀取版本號失敗:', error.message);
            } else {
              version = data?.value || 'unknown';
            }
          } catch (e) {
            console.warn('⚠️ 讀取版本號異常:', e);
          }

          console.log('📌 系統版本:', version);

          // 2. 把版本號帶進 SW URL
          const swUrl = `service-worker.js?v=${encodeURIComponent(version)}`;

          navigator.serviceWorker.register(swUrl, {
            scope: '/BHG_order_system/',
            updateViaCache: 'none'
          })
            .then(function(registration) {
              console.log('✅ Service Worker 註冊成功:', swUrl);

              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                console.log('🔄 發現新版本的 Service Worker');

                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('📥 新版本已就緒，發送 SKIP_WAITING 指令...');
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });
            })
            .catch(function(error) {
              console.warn('⚠️ Service Worker 註冊失敗:', error);
            });

          // 3. 控制權變更 → 自動重整
          let refreshing;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshing) return;
            refreshing = true;
            console.log('🔄 Service Worker 已更新，自動重新整理頁面...');
            window.location.reload();
          });
        });
      }
    </script>
